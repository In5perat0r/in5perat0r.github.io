<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="drawer">
    <header class="drawer__header">
      <h1 id="drawer-title" class="drawer__title">&nbsp;</h1>
      <p class="drawer__meta"><span id="entry-count">0</span> active nodes</p>
    </header>

    <ul id="card-list" class="cards" aria-live="polite">
      <!-- Cards are generated here from data.json via index.js -->
    </ul>

    <p id="empty-state" class="empty-state" hidden>No entries found. Check <code>data.json</code>.</p>
  </main>

  <script src="index.js"></script>
</body>
</html>
