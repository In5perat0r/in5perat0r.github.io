<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <main class="drawer">
    <header class="drawer__header">
      <p class="drawer__eyebrow">Verzeichnis</p>
      <h1 id="drawer-title" class="drawer__title">&nbsp;</h1>
      <p class="drawer__meta"><span id="entry-count">0</span> Einträge</p>
    </header>

    <ul id="card-list" class="cards" aria-live="polite">
      <!-- Karten werden hier per index.js aus data.json erzeugt -->
    </ul>

    <p id="empty-state" class="empty-state" hidden>Keine Einträge gefunden. Prüfe die <code>data.json</code>.</p>
  </main>

  <script src="index.js"></script>
</body>
</html>
