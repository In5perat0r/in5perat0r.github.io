<body>

  <a class="back-link" href="../index.html">&lsaquo; Index</a>

  <main class="page">
    <header class="page__header">
      <h1 class="page__title">Diagnostics</h1>
      <p class="page__meta">Reads out everything the browser exposes without asking for permission.</p>
    </header>

    <div class="controls">
      <button id="run-scan" class="btn btn--pink" type="button">Run diagnostic scan</button>
      <button id="copy-log" class="btn btn--ghost" type="button" disabled>Copy log</button>
    </div>

    <section id="log" class="log" aria-live="polite">
      <p class="log__placeholder">No scan run yet. Press "Run diagnostic scan" to generate a report.</p>
    </section>
  </main>
